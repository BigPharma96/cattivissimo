<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Cattivissimo Impostor</title>
<meta name="theme-color" content="#1663CE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cattivissimo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blu:#1663CE;
  --blu-scuro:#0B3E8C;
  --azzurro:#35A7F2;
  --azzurro-chiaro:#5FBEFA;
  --giallo:#FFD23F;
  --rosso:#FF3B3B;
  --nero:#0B1B33;
  --bianco:#FFFFFF;
  --ombra:0 6px 0 var(--nero);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  font-weight:700;
  color:var(--bianco);
  background:var(--blu);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100dvh;position:relative}

/* ---------- testo con contorno nero ---------- */
.ol{
  text-shadow:
    2px 0 0 var(--nero), -2px 0 0 var(--nero), 0 2px 0 var(--nero), 0 -2px 0 var(--nero),
    2px 2px 0 var(--nero), -2px 2px 0 var(--nero), 2px -2px 0 var(--nero), -2px -2px 0 var(--nero);
}
.ol-big{
  -webkit-text-stroke:6px var(--nero);
  paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(11,27,51,.45);
}

/* ---------- schermate ---------- */
.screen{
  display:none;
  min-height:100dvh;
  padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}
.screen.on{display:flex}
.screen{overflow-y:auto}
/* i margini auto centrano il contenuto ma senza tagliarlo in alto quando è più alto dello schermo */
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
#home>*:first-child{margin-top:auto}
#home>*:last-child{margin-bottom:auto}

/* ---------- splash ---------- */
#splash{
  background:radial-gradient(circle at 50% 38%, var(--azzurro-chiaro) 0%, var(--blu) 62%, var(--blu-scuro) 100%);
  gap:4px;
}
#splash .logo{width:min(48vw,220px);filter:drop-shadow(0 10px 0 rgba(11,27,51,.35))}
#splash .logo svg{width:100%;height:auto;display:block;border-radius:28%;border:5px solid var(--nero)}
.title-top{font-size:clamp(30px,9vw,58px);line-height:.95;letter-spacing:.5px;margin:0}
.title-bottom{font-size:clamp(38px,12vw,76px);line-height:.95;color:var(--giallo);margin:0}
.dots{margin-top:18px;display:flex;gap:10px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--bianco);border:3px solid var(--nero);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-11px)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* ---------- controlli ---------- */
h1.head{font-size:clamp(26px,7vw,40px);margin:0 0 4px;text-align:center;line-height:1.05}
p.sub{margin:0;text-align:center;font-size:17px;font-weight:600;opacity:.95}
label.field{display:flex;flex-direction:column;gap:6px;font-size:17px}
input[type=text],select{
  font-family:inherit;font-weight:700;font-size:19px;color:var(--nero);
  background:var(--bianco);border:4px solid var(--nero);border-radius:14px;
  padding:12px 14px;width:100%;box-shadow:0 4px 0 rgba(11,27,51,.55);
}
input[type=text]:focus-visible,select:focus-visible,button:focus-visible{
  outline:4px solid var(--giallo);outline-offset:3px;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--nero) 50%),linear-gradient(135deg,var(--nero) 50%,transparent 50%);
  background-position:calc(100% - 21px) 22px,calc(100% - 14px) 22px;background-size:7px 7px,7px 7px;background-repeat:no-repeat}
#code{text-transform:uppercase;letter-spacing:.28em;text-align:center;font-size:26px}

.btn{
  font-family:inherit;font-weight:800;font-size:21px;color:var(--nero);
  background:var(--giallo);border:4px solid var(--nero);border-radius:16px;
  padding:14px 20px;cursor:pointer;box-shadow:var(--ombra);transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--nero)}
.btn.white{background:var(--bianco)}
.btn.ghost{background:transparent;color:var(--bianco);box-shadow:none;border-width:3px;font-size:18px;padding:9px 16px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:12px}
.row>*{flex:1}

/* toggle */
.toggle{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.13);border:3px solid var(--nero);border-radius:16px;padding:12px 14px;cursor:pointer}
.toggle .txt{flex:1;font-size:16px;line-height:1.25;text-align:left}
.toggle .txt small{display:block;font-weight:600;font-size:13.5px;opacity:.85;margin-top:2px}
.sw{width:62px;height:34px;flex:none;border:4px solid var(--nero);border-radius:20px;background:#8FA9C9;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--bianco);border:3px solid var(--nero);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--giallo)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(26px)}

/* ---------- home: due quadratoni ---------- */
.choices{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.choice{
  width:230px;aspect-ratio:1/1;border:5px solid var(--nero);border-radius:26px;
  background:var(--giallo);color:var(--nero);box-shadow:0 9px 0 var(--nero);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-family:inherit;font-weight:800;font-size:24px;line-height:1.05;text-align:center;padding:16px;cursor:pointer;
  transition:transform .07s,box-shadow .07s;
}
.choice:active{transform:translateY(7px);box-shadow:0 2px 0 var(--nero)}
.choice.blue{background:var(--azzurro);color:var(--bianco)}
.choice svg{width:64px;height:64px}
@media (max-width:700px){
  .choices{flex-direction:column;align-items:center;gap:18px}
  .choice{width:min(76vw,250px);aspect-ratio:1.35/1;font-size:22px}
  .choice svg{width:48px;height:48px}
}

/* ---------- lobby ---------- */
#lobby{background:linear-gradient(180deg,var(--azzurro) 0%,#2E93E0 100%);justify-content:flex-start;gap:14px}
.counter{font-size:clamp(24px,6.5vw,34px);margin:0;letter-spacing:1px}
.roomtag{font-size:16px;font-weight:600;opacity:.95;margin:0;text-align:center}
.codechip{
  align-self:center;background:var(--bianco);color:var(--nero);border:4px solid var(--nero);border-radius:14px;
  padding:8px 18px;font-size:26px;letter-spacing:.24em;box-shadow:0 4px 0 rgba(11,27,51,.5);cursor:pointer;
}
.plist{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.plist li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border:3px solid rgba(11,27,51,.55);border-radius:13px;padding:9px 13px;font-size:17px}
.plist li .tick{margin-left:auto;font-size:18px}
.spacer{flex:1}

/* ---------- gioco ---------- */
#game{background:linear-gradient(180deg,#1F74DE 0%,var(--blu) 45%,var(--blu-scuro) 100%);justify-content:center;gap:8px;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.wordlabel{font-size:17px;font-weight:600;letter-spacing:.16em;opacity:.9;margin:0}
.word{
  font-size:clamp(40px,13vw,86px);line-height:1.02;margin:6px 0 0;text-align:center;
  word-break:break-word;max-width:min(92vw,760px);
}
.word.long{font-size:clamp(32px,9.5vw,68px)}
.word.xlong{font-size:clamp(26px,7.5vw,54px)}
.word.impostor{color:var(--rosso)}
.mates{margin:22px 0 0;font-size:17px;text-align:center;font-weight:600;background:rgba(11,27,51,.3);border:3px solid rgba(11,27,51,.6);border-radius:14px;padding:10px 16px}
.corner{
  position:fixed;width:62px;height:62px;border-radius:16px;border:4px solid var(--nero);
  background:var(--bianco);box-shadow:0 5px 0 var(--nero);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
.corner:active{transform:translateY(4px);box-shadow:0 1px 0 var(--nero)}
.corner svg{width:32px;height:32px}
.corner.left{left:20px;bottom:calc(20px + env(safe-area-inset-bottom))}
.corner.right{right:20px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--giallo)}

/* ---------- modale ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,17,38,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.overlay.on{display:flex}
.card{background:var(--azzurro);border:5px solid var(--nero);border-radius:22px;box-shadow:0 10px 0 rgba(11,27,51,.55);padding:24px;max-width:400px;width:100%;text-align:center}
.card p{margin:0 0 18px;font-size:21px;line-height:1.25}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));
  background:var(--nero);color:var(--bianco);border:3px solid var(--bianco);border-radius:14px;padding:10px 18px;font-size:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.err{color:#FFE08A;font-size:16px;font-weight:700;text-align:center;margin:0;min-height:1px}
.setup{background:rgba(11,27,51,.4);border:3px solid var(--nero);border-radius:16px;padding:16px;font-size:15px;font-weight:600;line-height:1.45}
.setup code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- ============ SPLASH ============ -->
  <section id="splash" class="screen on">
    <h1 class="title-top ol">Cattivissimo</h1>
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57B8F8"/>
      <stop offset="1" stop-color="#1663CE"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D3AD"/>
      <stop offset="1" stop-color="#EAB182"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="252" r="212" fill="#0E4EA8" opacity=".3"/>

  <g stroke="#101014" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

    <!-- neck -->
    <path d="M216 322H296V382C296 398 278 410 256 410C234 410 216 398 216 382Z" fill="#DFA87A"/>

    <!-- shoulders / black sweater -->
    <path d="M56 512C72 434 138 396 204 384L308 384C374 396 440 434 456 512Z" fill="#1A1A20"/>
    <path d="M204 384C214 416 236 432 256 432C276 432 298 416 308 384" fill="#101014"/>

    <!-- ears -->
    <path d="M140 232C122 226 112 242 116 262C120 286 136 298 150 292Z" fill="url(#skin)"/>
    <path d="M372 232C390 226 400 242 396 262C392 286 376 298 362 292Z" fill="url(#skin)"/>

    <!-- face -->
    <path d="M138 254C138 158 178 110 256 110C334 110 374 158 374 254C374 328 332 384 256 384C180 384 138 328 138 254Z" fill="url(#skin)"/>

    <!-- beard -->
    <path d="M152 286C158 306 174 318 194 324C220 334 292 334 318 324C338 318 354 306 360 286C372 344 326 390 256 390C186 390 140 344 152 286Z" fill="#2E2118" stroke-width="8"/>

    <!-- eyebrows -->
    <path d="M172 214C190 192 232 190 250 210C231 204 195 206 176 222Z" fill="#2E2118" stroke-width="7"/>
    <path d="M340 214C322 192 280 190 262 210C281 204 317 206 336 222Z" fill="#2E2118" stroke-width="7"/>

    <!-- eyes -->
    <ellipse cx="208" cy="250" rx="28" ry="18" fill="#FFFFFF" stroke-width="7"/>
    <ellipse cx="304" cy="250" rx="28" ry="18" fill="#FFFFFF" stroke-width="7"/>
    <circle cx="211" cy="251" r="11" fill="#3D2716" stroke="none"/>
    <circle cx="301" cy="251" r="11" fill="#3D2716" stroke="none"/>
    <circle cx="211" cy="251" r="5" fill="#100C08" stroke="none"/>
    <circle cx="301" cy="251" r="5" fill="#100C08" stroke="none"/>
    <circle cx="206" cy="245" r="4" fill="#FFFFFF" stroke="none"/>
    <circle cx="296" cy="245" r="4" fill="#FFFFFF" stroke="none"/>

    <!-- nose -->
    <path d="M246 250C239 274 231 292 239 300C246 307 266 307 273 300C281 292 273 274 266 250" fill="none" stroke-width="8"/>

    <!-- moustache -->
    <path d="M202 312C221 298 243 302 256 314C269 302 291 298 310 312C303 330 274 334 256 324C238 334 209 330 202 312Z" fill="#241A13" stroke-width="7"/>

    <!-- smiling mouth -->
    <path d="M214 330C232 352 280 352 298 330C282 338 230 338 214 330Z" fill="#7A3038" stroke-width="7"/>
    <path d="M221 332C237 337 275 337 291 332" fill="#FFFFFF" stroke="none"/>

    <!-- hair -->
    <path d="M128 250C116 152 168 96 256 96C344 96 396 152 384 250C378 214 366 184 350 166C336 176 324 172 316 158C294 172 268 164 254 146C236 168 206 178 186 166C174 176 162 178 152 170C141 188 133 218 128 250Z" fill="#2E2118" stroke-width="9"/>
    <path d="M196 124C178 134 164 148 156 166" fill="none" stroke="#4E3B2B" stroke-width="8"/>
    <path d="M304 120C324 130 340 146 348 164" fill="none" stroke="#4E3B2B" stroke-width="8"/>
  </g>
</svg></div>
    <h2 class="title-bottom ol-big">Impostor</h2>
    <div class="dots"><i></i><i></i><i></i></div>
  </section>

  <!-- ============ PROFILO ============ -->
  <section id="profile" class="screen">
    <div class="wrap">
      <h1 class="head ol" data-t="nickTitle"></h1>
      <label class="field"><span data-t="nickLabel"></span>
        <input id="nick" type="text" maxlength="14" autocomplete="nickname" spellcheck="false">
      </label>
      <label class="field"><span data-t="langLabel"></span>
        <select id="lang">
          <option value="en">English</option>
          <option value="it">Italiano</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
        </select>
      </label>
      <p class="err" id="profileErr"></p>
      <button class="btn" id="goProfile" data-t="go"></button>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="home" class="screen">
    <h1 class="head ol" id="hello"></h1>
    <div class="choices">
      <button class="choice" id="btnCreate">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10v28M10 24h28"/><rect x="5" y="5" width="38" height="38" rx="9"/></svg>
        <span data-t="create"></span>
      </button>
      <button class="choice blue" id="btnJoin">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6h9a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4h-9"/><path d="M18 33l9-9-9-9M27 24H7"/></svg>
        <span data-t="join"></span>
      </button>
    </div>
    <button class="btn ghost" id="editProfile" data-t="changeName"></button>
  </section>

  <!-- ============ CREA STANZA ============ -->
  <section id="create" class="screen">
    <div class="wrap">
      <h1 class="head ol" data-t="create"></h1>
      <label class="field"><span data-t="roomName"></span>
        <input id="roomName" type="text" maxlength="24">
      </label>
      <div class="row">
        <label class="field"><span data-t="players"></span>
          <select id="maxPlayers"></select>
        </label>
        <label class="field"><span data-t="impostors"></span>
          <select id="numImp"></select>
        </label>
      </div>
      <button class="toggle" id="knowToggle" aria-pressed="false">
        <span class="txt"><span data-t="knowEachOther"></span><small data-t="knowHint"></small></span>
        <span class="sw"></span>
      </button>
      <label class="field"><span data-t="category"></span>
        <select id="category">
          <option value="football" data-t="catFootball"></option>
          <option value="cities" data-t="catCities"></option>
          <option value="animals" data-t="catAnimals"></option>
          <option value="sports" data-t="catSports"></option>
        </select>
      </label>
      <label class="field"><span data-t="codeLabel"></span>
        <input id="code" type="text" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false">
      </label>
      <p class="err" id="createErr"></p>
      <button class="btn" id="doCreate" data-t="createGo"></button>
      <button class="btn ghost" data-back data-t="back"></button>
    </div>
  </section>

  <!-- ============ ENTRA IN STANZA ============ -->
  <section id="join" class="screen">
    <div class="wrap">
      <h1 class="head ol" data-t="join"></h1>
      <label class="field"><span data-t="joinCode"></span>
        <input id="joinCode" type="text" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false"
               style="text-transform:uppercase;letter-spacing:.28em;text-align:center;font-size:26px">
      </label>
      <p class="err" id="joinErr"></p>
      <button class="btn" id="doJoin" data-t="joinGo"></button>
      <button class="btn ghost" data-back data-t="back"></button>
    </div>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="screen">
    <h1 class="counter ol" id="counter">0/0</h1>
    <p class="roomtag" id="roomTag"></p>
    <button class="codechip" id="codeChip"></button>
    <ul class="plist" id="players"></ul>
    <div class="spacer"></div>
    <p class="sub" id="lobbyMsg"></p>
    <button class="btn" id="readyBtn" style="display:none;min-width:250px" data-t="ready"></button>
    <button class="btn ghost" id="leaveLobby" data-t="leave"></button>
  </section>

  <!-- ============ GIOCO ============ -->
  <section id="game" class="screen">
    <p class="wordlabel ol" data-t="yourWord"></p>
    <h1 class="word ol-big" id="theWord"></h1>
    <p class="mates" id="mates" style="display:none"></p>
    <button class="corner left" id="homeCorner" aria-label="home">
      <svg viewBox="0 0 32 32" fill="none" stroke="#0B1B33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15L16 5l12 10"/><path d="M7 14v12h18V14"/><path d="M13 26v-7h6v7"/></svg>
    </button>
    <button class="corner right" id="nextCorner" aria-label="next">
      <svg viewBox="0 0 32 32" fill="none" stroke="#0B1B33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h21M18 8l8 8-8 8"/></svg>
    </button>
  </section>

  <!-- ============ ESITO ============ -->
  <section id="result" class="screen">
    <div class="wrap">
      <h1 class="head ol" data-t="resultQ"></h1>
      <button class="btn" id="btnWon" data-t="won"></button>
      <button class="btn white" id="btnLost" data-t="lost"></button>
    </div>
  </section>

  <!-- ============ ANCORA? ============ -->
  <section id="again" class="screen">
    <div class="wrap">
      <h1 class="head ol" id="scoreLine"></h1>
      <p class="sub" data-t="againQ"></p>
      <button class="btn" id="btnAgain" data-t="again"></button>
      <button class="btn white" id="btnHome" data-t="home"></button>
    </div>
  </section>

  <!-- ============ SETUP MANCANTE ============ -->
  <section id="setup" class="screen">
    <div class="wrap">
      <h1 class="head ol">Firebase</h1>
      <div class="setup" id="setupText"></div>
    </div>
  </section>

</div>

<div class="overlay" id="confirm">
  <div class="card">
    <p data-t="sureHome"></p>
    <div class="row">
      <button class="btn" id="confirmYes" data-t="yes"></button>
      <button class="btn white" id="confirmNo" data-t="no"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="words.js"></script>
<script src="i18n.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
